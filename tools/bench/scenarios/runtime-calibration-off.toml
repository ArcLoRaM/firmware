# Purpose: acceptance (control stretch). Issue #34, Test Record
# docs/test-tracker/34-runtime-calibration.md.
# Same pair, same schedule and same detune as runtime-calibration.toml (see its
# header for why: Node 1 and Node 4 are matched to +0.59 ppm, so the C2's RTC is
# detuned by +7.6 ppm at boot, BENCH_CALR_BOOT_PULSES=8), with the RTC_CALR
# write disabled (BENCH_CALR_OFF=1): the estimator and the DRIFT events still
# run, the clock stays ~+8.2 ppm fast and is only ever corrected by the Tier 2
# shift. The residual stays at ~8200 ppb where the calibrated run brings it
# under one step. 2.1 h (60 samples), enough for the reference.
description = "Control: detuned C2, the CALR write disabled"
timeout = "140m"

[nodes]
1 = "C3"
4 = "C2"

[overrides]
BENCH_CALR_OFF = "1"
SYNC_TX_BUDGET = "1u"
SYNC_CELL_GAP_MS = "9500u"
BENCH_CALR_BOOT_PULSES = "8"

[[expect]]
node = 1
event = "SYNC_TX"

[[expect]]
node = 4
event = "CALR"
where = { res = "preset", calp = 1, calm = 504 }
within = "1m"

[[expect]]
node = 4
event = "CLK"
where = { to = "ACQ" }
within = "4m"

[[expect]]
node = 4
event = "CLK"
where = { to = "WARM" }
within = "10m"

# The uncalibrated clock drifts ~8 ms per 16 min: the Tier 2 shift is its only
# correction, several times in the run.
[[expect]]
node = 4
event = "RTC_SHIFT"
where = { res = "ok" }
count = 4
within = "100m"

[[expect]]
node = 4
event = "DRIFT"
where = { ok = 1 }
within = "40m"

# The residual of the detuned clock without calibration: 7.6 + 0.6 ppm.
[[expect]]
node = 4
event = "DRIFT"
where = { ok = 1, resid = { min = 7000, max = 9500 } }
count = 20
within = "130m"

[[expect]]
node = 4
event = "DRIFT"
count = 60
within = "130m"

# The boot lines CALR res=boot and res=preset are not writes; any write is.
[[forbid]]
event = "CALR"
where = { res = "ok" }

[[forbid]]
event = "CALR"
where = { res = "fail" }

[[forbid]]
event = "CALR"
where = { res = "busy" }

[[forbid]]
event = "SYNC_RX"
where = { act = "t3" }

[[forbid]]
event = "TX_DENIED"

[[forbid]]
event = "SYNC_SILENCE"

[[forbid]]
event = "SLOT_SUSPECT"
