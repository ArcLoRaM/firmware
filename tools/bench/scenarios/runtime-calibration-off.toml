# Purpose: acceptance (control stretch). Issue #34, Test Record
# docs/test-tracker/34-runtime-calibration.md.
# Same pair, same duration as runtime-calibration.toml with the RTC_CALR write
# disabled (BENCH_CALR_OFF=1): the estimator and the DRIFT events still run, so
# the uncalibrated rate of the pair is measured the same way (the 2026-09-26
# bench gave +8.1 ppm) and the calibrated run has its comparison.
# Same Sync schedule as the calibrated run: within the duty-cycle budget, see
# runtime-calibration.toml.
description = "Control: C2 rate estimate with the CALR write disabled"
timeout = "270m"

[nodes]
1 = "C3"
4 = "C2"

[overrides]
BENCH_CALR_OFF = "1"
SYNC_TX_BUDGET = "1u"
SYNC_CELL_GAP_MS = "9500u"
BENCH_CALR_RESET = "1"

[[expect]]
node = 1
event = "SYNC_TX"

[[expect]]
node = 4
event = "CLK"
where = { to = "ACQ" }
within = "4m"

[[expect]]
node = 4
event = "CLK"
where = { to = "WARM" }
within = "10m"

[[expect]]
node = 4
event = "DRIFT"
where = { ok = 1 }
within = "40m"

# The boot line CALR res=boot is not a write; a write of any result is.
# bench ends a run as soon as every expectation is met, so the duration is held
# by this one: a DRIFT line per Sync phase (120 s), 115 of them are 3.9 h. The
# residual after calibration is read from them (resid = rate + applied).
[[expect]]
node = 4
event = "DRIFT"
count = 115
within = "255m"

[[forbid]]
event = "CALR"
where = { res = "ok" }

[[forbid]]
event = "CALR"
where = { res = "fail" }

[[forbid]]
event = "CALR"
where = { res = "busy" }

[[forbid]]
event = "SYNC_RX"
where = { act = "t3" }

[[forbid]]
event = "TX_DENIED"

[[forbid]]
event = "SYNC_SILENCE"

[[forbid]]
event = "SLOT_SUSPECT"
