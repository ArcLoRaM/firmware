# Issue #55 (acceptance): after a Packet 1 clock set, the C2's clock matches
# the C3's within +/-1 ms. The acquisition packets that follow the set
# (act=good) read err = stamp - expected, so they must stay within -1..1.
# Red before the fix: err=-3 on every boot (2026-10-01).
description = "C2's clock set from Packet 1 is within 1 ms of the C3"
timeout = "5m"

[nodes]
1 = "C3"
2 = "C2"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "good", err = { min = -1, max = 1 } }
count = 2
within = "3m"

[[expect]]
node = 2
event = "CLK"
where = { to = "WARM" }
within = "3m"

[[forbid]]
node = 2
event = "SYNC_RX"
where = { act = "good", err = { max = -2 } }

[[forbid]]
node = 2
event = "SYNC_RX"
where = { act = "good", err = { min = 2 } }
