# Written against the 30 s Sync grid (3 cells per phase, a cell every 3 s): pinned to the
# BRINGUP profile now that the default is DEV (sync_profile.h, ADR-0020).
# Issue #28: a cold C2 sets its RTC from a Sync packet whose cell is after
# midnight, in a phase that started before it, and must set the next day's date.
# The Sync grid hangs on the C3's boot (phases 30 s apart, 10 cells of 3 s,
# first one 26-29 ms after the boot RTC, it varies per boot): BENCH_RTC_START_S
# = 86277 starts the C3 at 23:57:57, so a phase starts at 23:59:57.03 (cell 0),
# cell 1 is on air at 00:00:00.03 and cell 2 at 00:00:03.03. The C3 boots on
# 2000-01-01 (date=000101) and its calendar rolls to 000102 at midnight.
# The C2 locks from the first phase, then is reset 1 s into the straddling
# phase. A C2 takes about 3.5 s from reset to its first packet, so its
# Packet 1 is cell 1 or 2, and must carry 2000-01-02.
# The C3's duty-cycle credit is still full at midnight.
description = "Cold C2 sets the next day's date from a cell after midnight"
timeout = "8m"

[nodes]
1 = "C3"
2 = "C2"

[overrides]
SYNC_PROFILE = "SYNC_PROFILE_BRINGUP"
BENCH_RTC_START_S = "86277"

# The C3's boot RTC_SET is logged before the run arms, so the reset is timed
# from arming: the straddling phase starts 116.6 s after it (measured, +-0.5 s
# between runs), the reset 1 s into it.
[[action]]
reset = 2
at = "+118s"

# The set after the reset: the packet is cell 1 or 2 of the phase that started
# at 23:59:57, so the time is 00:00:0x and the date the next day's (the C2's
# boot-time set, from the first phase, is on 000101). Read the trace for
# SYNC_RX ce=1 or 2 act=set just before it.
[[expect]]
node = 2
event = "RTC_SET"
where = { date = "000102" }
within = "6m"

[[expect]]
node = 2
event = "CLK"
where = { to = "WARM" }
count = 2          # before and after the reset
within = "6m"

[[forbid]]
event = "SLOT_SUSPECT"

[[forbid]]
event = "SYNC_SILENCE"
