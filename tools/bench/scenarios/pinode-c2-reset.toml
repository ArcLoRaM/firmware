# Purpose: spontaneous. Test Record docs/test-tracker/spot-20261004-pinode-c2.md, issue #78 (item 3).
# Node 2 is the board wired to the Pi Node nuna-node-02: flashed as C2 through the Pi, observed
# through the Pi's log and reset through the Pi. The sender on the other Pi Node keeps running and
# is not touched, so the C2 can only reach WARM from its Sync.
description = "A board on a Pi Node: flashed as C2, observed and reset through the Pi"
timeout = "25m"

[nodes]
2 = "C2"

[[action]]
reset = 2
at = "+90s"

[[expect]]
node = 2
event = "CLK"
where = { to = "WARM" }
within = "20m"
