# Purpose: acceptance. Issue #34, Test Record docs/test-tracker/34-runtime-calibration.md.
# C3 + C2 for hours: the C2 estimates its rate offset against the C3 from the
# Sync errors (DRIFT), writes RTC_CALR only when the estimate is valid and the
# residual reaches 3/4 of a step (CALR), and nothing in the shift and re-anchor
# paths breaks (no Tier 3, no silence). The residual after calibration is read
# from the DRIFT events of the run, against the control scenario
# runtime-calibration-off.toml (same pair, same duration, the write disabled).
# Schedule: the default Sync table is 9.9 % duty cycle and starves the C3 after
# 6.1 min (TX_DENIED), which the field will not see. The Build Overrides
# SYNC_TX_BUDGET=1u and SYNC_CELL_GAP_MS=9500u give a Sync phase every 120 s,
# one packet per phase (0.83 %, never denied: sync-budget-c3.toml on the board,
# Tests/unit/test_sync_budget.c in 4 h); no TX_DENIED is allowed in the run.
# Staged: smoke and lock in the first minutes, the first valid estimate and
# the first write within the first hour, forbids for the rest.
# Needs a pair whose rate offset is above 0.72 ppm (the 2026-09-26 pair had
# +8.1 ppm); on a closer pair no CALR is written and the CALR expectation
# below fails with that cause, read from the DRIFT rate.
description = "C2 estimates its rate against the C3 and calibrates RTC_CALR"
timeout = "4h"

[nodes]
1 = "C3"
4 = "C2"

[overrides]
SYNC_TX_BUDGET = "1u"
SYNC_CELL_GAP_MS = "9500u"

[[expect]]
node = 1
event = "SYNC_TX"

[[expect]]
node = 4
event = "CLK"
where = { to = "ACQ" }
within = "4m"

[[expect]]
node = 4
event = "CLK"
where = { to = "WARM" }
within = "10m"

# 20 min of baseline at one packet per 120 s, plus the lock.
[[expect]]
node = 4
event = "DRIFT"
where = { ok = 1 }
within = "40m"

[[expect]]
node = 4
event = "CALR"
where = { res = "ok" }
within = "45m"

[[forbid]]
event = "CALR"
where = { res = "fail" }

[[forbid]]
event = "SYNC_RX"
where = { act = "t3" }

[[forbid]]
event = "TX_DENIED"

[[forbid]]
event = "SYNC_SILENCE"

[[forbid]]
event = "SLOT_SUSPECT"
