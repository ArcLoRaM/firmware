# Purpose: acceptance. Issue #34, Test Record docs/test-tracker/34-runtime-calibration.md.
# C3 (Node 1) + C2 (Node 4) for 3.9 h: the C2 estimates its rate offset against
# the C3 from the Sync errors (DRIFT), writes RTC_CALR when the estimate is valid
# and the residual reaches 3/4 of a step (CALR), and the residual after the
# write stays within one step. Shift and re-anchor paths keep working (no Tier 3,
# no silence). The uncalibrated reference is runtime-calibration-off.toml (same
# pair, same schedule, same detune, the write disabled).
#
# The pair: Node 1 and Node 4 are matched to +0.59 ppm, under the 0.72 ppm
# residual at which a write is due (run of 2026-10-02 21:42: the estimate settled
# at 574-602 ppb and no CALR was written, as designed). To have a rate to cancel,
# the C2's RTC is detuned at boot through the same register,
# BENCH_CALR_BOOT_PULSES=8: +8 pulses, +7.63 ppm, as a wrong static calibration
# (#23) would. The C2 then runs ~+8.2 ppm fast against the C3 (the 2026-09-26
# bench had +8.1 ppm); the estimator knows the applied setting and reports the
# rate with no calibration (~0.6 ppm), and the residual (~8.2 ppm) is what the
# write must cancel: resid = rate + applied.
#
# Schedule: the default Sync table is 9.9 % duty cycle and starves the C3 after
# 6.1 min (TX_DENIED), which the field will not see. The Build Overrides
# SYNC_TX_BUDGET=1u and SYNC_CELL_GAP_MS=9500u give a Sync phase every 120 s,
# one packet per phase (0.83 %, never denied: sync-budget-c3.toml on the board,
# Tests/unit/test_sync_budget.c in 4 h); no TX_DENIED is allowed in the run.
#
# bench ends a run as soon as every expectation is met: the duration is held by
# the DRIFT count (a line per Sync phase, 115 of them are 3.9 h).
description = "C2 (detuned +7.6 ppm) estimates its rate against the C3 and calibrates RTC_CALR"
timeout = "270m"

[nodes]
1 = "C3"
4 = "C2"

[overrides]
SYNC_TX_BUDGET = "1u"
SYNC_CELL_GAP_MS = "9500u"
BENCH_CALR_BOOT_PULSES = "8"

[[expect]]
node = 1
event = "SYNC_TX"

# The detune itself, written at boot (a normal build logs res=boot instead).
[[expect]]
node = 4
event = "CALR"
where = { res = "preset", calp = 1, calm = 504 }
within = "1m"

[[expect]]
node = 4
event = "CLK"
where = { to = "ACQ" }
within = "4m"

[[expect]]
node = 4
event = "CLK"
where = { to = "WARM" }
within = "10m"

# 8 ms of error after ~16 min at +8.2 ppm: the Tier 2 shift the estimator
# must unwrap.
[[expect]]
node = 4
event = "RTC_SHIFT"
where = { res = "ok" }
within = "30m"

# 20 min of baseline at one packet per 120 s, plus the lock.
[[expect]]
node = 4
event = "DRIFT"
where = { ok = 1 }
within = "40m"

[[expect]]
node = 4
event = "CALR"
where = { res = "ok" }
within = "45m"

# After the write the residual is within one step (954 ppb): 30 estimates, an
# hour of packets, all within it. Before the write it is ~8200.
[[expect]]
node = 4
event = "DRIFT"
where = { ok = 1, resid = { min = -954, max = 954 } }
count = 30
within = "150m"

[[expect]]
node = 4
event = "DRIFT"
count = 115
within = "255m"

[[forbid]]
event = "CALR"
where = { res = "fail" }

[[forbid]]
event = "SYNC_RX"
where = { act = "t3" }

[[forbid]]
event = "TX_DENIED"

[[forbid]]
event = "SYNC_SILENCE"

[[forbid]]
event = "SLOT_SUSPECT"
