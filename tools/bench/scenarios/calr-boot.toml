# Purpose: acceptance (boot path). Issue #34, Test Record docs/test-tracker/34-runtime-calibration.md.
# One C2 boots: the platform reads the RTC_CALR held in the register and logs it
# (CALR res=boot), so the drift estimator starts from the real setting (a static
# calibration, #23, or none). A fresh board holds 0. No C3: the node stays cold
# and no sample, so no DRIFT and no CALR write, is made.
description = "C2 reads RTC_CALR at boot and logs it"
timeout = "2m"

[nodes]
4 = "C2"

[[expect]]
node = 4
event = "MAC_INIT"

[[expect]]
node = 4
event = "CALR"
where = { res = "boot", calp = 0, calm = 0, cal0 = 0, trim = 0 }
within = "1m"

[[forbid]]
event = "DRIFT"

[[forbid]]
event = "CALR"
where = { res = "ok" }
