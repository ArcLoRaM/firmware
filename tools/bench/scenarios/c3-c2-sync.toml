# Written against the 30 s Sync grid (3 cells per phase, a cell every 3 s): pinned to the
# BRINGUP profile now that the default is DEV (sync_profile.h, ADR-0020).
# C3 anchor and one C2: the C2 acquires the C3's clock and locks.
description = "C2 locks to the C3"
timeout = "10m"

[nodes]
1 = "C3"
2 = "C2"

[overrides]
SYNC_PROFILE = "SYNC_PROFILE_BRINGUP"

[[expect]]
node = 1
event = "SYNC_TX"

[[expect]]
node = 2
event = "CLK"
where = { to = "ACQ" }
within = "3m"

[[expect]]
node = 2
event = "CLK"
where = { to = "WARM" }
within = "8m"
