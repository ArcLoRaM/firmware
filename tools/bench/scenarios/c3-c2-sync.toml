# C3 anchor and one C2: the C2 acquires the C3's clock and locks.
description = "C2 locks to the C3"
timeout = "10m"

[nodes]
1 = "C3"
2 = "C2"

[[expect]]
node = 1
event = "SYNC_TX"

[[expect]]
node = 2
event = "CLK"
where = { to = "ACQ" }
within = "3m"

[[expect]]
node = 2
event = "CLK"
where = { to = "WARM" }
within = "8m"
