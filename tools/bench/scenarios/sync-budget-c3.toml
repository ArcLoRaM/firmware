# Purpose: acceptance (schedule for the multi-hour runs). Issue #34, Test Record
# docs/test-tracker/34-runtime-calibration.md.
# The former default Sync table, now SYNC_PROFILE_BRINGUP (a packet in 3 cells of each 30 s phase) is 9.9 % duty
# cycle: the 36 s credit is gone after 6.1 min and the C3 is denied (TX_DENIED)
# from then on. A multi-hour run must not be starved, as in the field it will
# not be (#45). The Build Overrides SYNC_TX_BUDGET=1u and SYNC_CELL_GAP_MS=9500u
# give a Sync phase every 120 s with one packet per phase: 0.83 %, never denied
# (host: Tests/unit/test_sync_budget.c). One C3, no peer: its packets are on air
# at the rate the overrides set, and the credit is never short. The run is longer
# than the 6.1 min after which the default schedule is denied.
description = "C3 sends one Sync packet per 120 s phase and is never denied"
timeout = "10m"

[nodes]
1 = "C3"

[overrides]
SYNC_TX_BUDGET = "1u"
SYNC_CELL_GAP_MS = "9500u"

# One packet per phase, in cell 0, both phases of the frame: the 5th packet is
# at 8.1 min, past the 6.1 min where the default schedule is denied.
[[expect]]
node = 1
event = "SYNC_TX"
where = { ce = 0 }
count = 5
within = "9m"

[[forbid]]
event = "SYNC_TX"
where = { ce = 1 }

[[forbid]]
event = "TX_DENIED"

[[forbid]]
event = "TX_LATE"
