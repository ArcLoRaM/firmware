# Purpose: spontaneous, paired with the multi-hour C3 + C2 criterion of #45 "Sync schedule within
# the duty-cycle budget". Test Record docs/test-tracker/spot-20261007-node2-as-c3.md, issue #101.
# Roles swapped against the three node silences (docs/test-tracker/node-silences.md): Node 2, the
# board that stopped as a C2 on 2026-10-04, 2026-10-06 and 2026-10-07, runs as the C3; Node 5, the
# board that ran as a C3 without a stop, runs as the C2. Which board stops, if one does, tells the
# board (Node 2 stops again) from the C2 role (Node 5 stops).
# DEV Sync profile (a phase every 200 s, one packet per node). SYNC_BOOT_BURST=5u gets the C2 to
# WARM within about 70 s of arming (sync-profile-dev-burst.toml); #45 asks for no TX_DENIED after it.
# There is no event for a node that went silent (#86), so liveness is a count of the slots each
# node logs: one per 20 s, 180 an hour on both a C3 and a C2 (counted on 2026-10-07 on Node 2 and
# Node 5); the run asks for 150 an hour, so a node that stops fails within an hour of stopping.
# The host is needed for `bench flash` only: the run is decided from the log collector's lines
# (python -m bench.collector, command in the Test Record), so it can be switched off meanwhile.
description = "Soak, roles swapped: Node 2 as C3, Node 5 as C2, DEV profile, 12 h"
timeout = "750m"

[nodes]
2 = "C3"
5 = "C2"

[overrides]
SYNC_BOOT_BURST = "5u"

[[expect]]
node = 5
event = "CLK"
where = { to = "WARM" }
within = "5m"

