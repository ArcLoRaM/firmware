# Purpose: acceptance. Issue #82, Test Record docs/test-tracker/82-fine-stamps.md.
# C3 (Node 1) + C2 (Node 4), NUCLEO Clock, nothing injected: the Sync error is
# now taken from a stamp in RTC ticks and logged in microseconds (SYNC_RX erru).
# 60 min on the 120 s schedule inside the duty-cycle budget (SYNC_TX_BUDGET=1u,
# SYNC_CELL_GAP_MS=9500u, as runtime-calibration.toml): 28 packets once locked,
# enough to read the scatter of erru at rest and compare it with the 0.36 ms of
# the old whole-ms err (#34). The sigma is read from the run record
# (docs/test-tracker/82-fine-stamps.md); the scenario holds the duration with a
# count of SYNC_RX lines and forbids what would invalidate the premise.
description = "Fine SyncStamp: 60 min of erru at rest on the NUCLEO pair"
timeout = "75m"

[nodes]
1 = "C3"
4 = "C2"

[overrides]
SYNC_TX_BUDGET = "1u"
SYNC_CELL_GAP_MS = "9500u"
BENCH_CALR_BOOT_PULSES = "0"

[[expect]]
node = 1
event = "SYNC_TX"

[[expect]]
node = 4
event = "CLK"
where = { to = "WARM" }
within = "10m"

[[expect]]
node = 4
event = "SYNC_RX"
where = { act = "t1" }
count = 28
within = "70m"

[[forbid]]
event = "TX_DENIED"

[[forbid]]
event = "SYNC_RX"
where = { act = "t3" }

[[forbid]]
event = "SYNC_SILENCE"

[[forbid]]
event = "SLOT_SUSPECT"
