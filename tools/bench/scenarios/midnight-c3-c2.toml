# Written against the 30 s Sync grid (3 cells per phase, a cell every 3 s): pinned to the
# BRINGUP profile now that the default is DEV (sync_profile.h, ADR-0020).
# Issue #54: a C3 and a locked C2 cross RTC midnight on the TDMA grid.
# BENCH_RTC_START_S = 85800 starts the C3 at 23:50:00: the C2 locks before
# midnight, and the C3's duty-cycle credit runs out (about boot + 6.5 min)
# before 00:00, so a credit refill at midnight would show as a Tx burst.
# The run passes only after both nodes reach the 00:10 slot.
description = "C3 and C2 cross RTC midnight"
timeout = "25m"

[nodes]
1 = "C3"
2 = "C2"

[overrides]
SYNC_PROFILE = "SYNC_PROFILE_BRINGUP"
BENCH_RTC_START_S = "85800"

[[expect]]
node = 2
event = "CLK"
where = { to = "WARM" }
within = "8m"

# The phase that starts at 00:00:00.026 on both nodes.
[[expect]]
node = 1
event = "SLOT"
where = { ph = "0", ce = "0", nom = "26" }
within = "12m"

[[expect]]
node = 2
event = "SLOT"
where = { ph = "0", ce = "0", nom = "26" }
within = "12m"

# Ten minutes after midnight, still on the grid.
[[expect]]
node = 1
event = "SLOT"
where = { ph = "0", ce = "0", nom = "600026" }
within = "22m"

[[expect]]
node = 2
event = "SLOT"
where = { ph = "0", ce = "0", nom = "600026" }
within = "22m"

[[forbid]]
event = "SLOT_SUSPECT"

[[forbid]]
event = "TX_TIMEOUT"

# Sparse C3 packets (duty-cycle denials) are not silence (#33).
[[forbid]]
event = "SYNC_SILENCE"

[[forbid]]
node = 2
event = "CLK"
where = { to = "COLD" }
