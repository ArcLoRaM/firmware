[project]
name = "bench"
version = "0.1.0"
description = "Build, flash and test the ArcLoRaM firmware on the bench boards without a human in the loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Rebuild when the sources change, not only pyproject.toml.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
