[project]
name = "arclog"
version = "0.1.0"
description = "Capture, classify, merge and analyse ArcLoRaM ArcLog serial traces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
arclog = "arclog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arclog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
